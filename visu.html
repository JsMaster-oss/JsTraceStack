<script type="text/javascript">

    var list_nom_selecteur = ["reference_article", "programme","fournisseur","categorie","sous_categorie"];

    /* Combinaisons de valeurs réellement présentes en base, renvoyées par
       /get_data_selecteur sous la clé "combinaisons". Sert à rendre les
       sélecteurs interdépendants. Si le serveur ne la renvoie pas encore,
       la liste reste vide et l'interdépendance est simplement inactive. */
    var list_combinaison = [];

    // Variables for cards page
    let count = 0;
    const grid = $(".card-grid");
    const cardGraph1 = $('#CardGraph1');
    const pageGraph1 = $('container card white margin-bottom');
    const cardGraph2 = $('#CardGraph2');
    const cardGraph3 = $('#CardGraph3');
    let numPageGraph = 1;

        $("#btn-group-nav-graphique").on("change", "#btn-vue-graphique-2", function() {

        $("#btn-group-nav-graphique").on("change", "#btn-vue-graphique-3", function() {

            changeGraph(numPageGraph);
        });

        var server_data = {"msg": "init_selecteur"};

    showAnalyseCCC = function(){

    /* ==================================================================
       SÉLECTEURS À CASES À COCHER

       Deux principes :

       1. Aucune case cochée sur un sélecteur = AUCUNE contrainte.
          Au chargement rien n'est coché et le graphique porte donc sur
          l'ensemble des données. L'utilisateur coche ce qu'il veut voir
          au lieu de décocher ce qu'il ne veut pas.

       2. Les sélecteurs sont INTERDÉPENDANTS : chaque sélecteur ne propose
          que les valeurs encore compatibles avec les choix faits sur les
          AUTRES sélecteurs. Le sélecteur lui-même est exclu du calcul, ses
          valeurs restent donc toutes affichées, ce qui permet d'élargir sa
          propre sélection.

       Le navigateur ne détient pas les données (c'est le serveur qui
       construit le graphique) : l'interdépendance s'appuie sur
       list_combinaison, fournie par /get_data_selecteur.
       ================================================================== */

    init_selecteur = function(data){

        // Combinaisons existantes (absentes => interdépendance inactive)
        list_combinaison = data["combinaisons"] || [];

        for(selecteur of list_nom_selecteur)
        {
            var divRadio = document.getElementById("id_list_check_"+selecteur);

            if(divRadio === null) { continue; }

            var list_option = data[selecteur] || [];

            divRadio.innerHTML = "";

            var fieldset = document.createElement('fieldset')
            fieldset.className = "scroll_selecteur"

            for(option of list_option)
            {
                var divCheckBox = document.createElement('div');

                var inputCheckBox = document.createElement('input');
                inputCheckBox.type = "checkbox";
                inputCheckBox.id = "id_checkbox_"+selecteur+"_"+option
                // Décoché par défaut : aucune contrainte, tout est pris en compte
                inputCheckBox.checked = false
                inputCheckBox.onclick = function () {maj_selecteur(); create_graph_analyse_CE2();};

                var labelCheckBox = document.createElement('label')
                // textContent et non innerHTML : innerHTML ré-encode &, < et >
                // à la relecture, le libellé renvoyé au serveur ne correspondrait
                // alors plus à la valeur en base et le graphique sortirait vide
                labelCheckBox.textContent = option;
                labelCheckBox.setAttribute("for",inputCheckBox.id);
                labelCheckBox.classList.add("filterDiv");

                divCheckBox.appendChild(inputCheckBox)
                divCheckBox.appendChild(labelCheckBox)

                fieldset.appendChild(divCheckBox)
            }
            divRadio.appendChild(fieldset)

            var inputCoche = document.getElementById("id_radio_"+selecteur);
            if(inputCoche !== null) { inputCoche.checked = false; }

            // On repart d'une recherche vide, sinon un texte résiduel
            // masquerait des valeurs de la liste fraîchement reconstruite
            var inputRecherche = document.getElementById("id_filtre_"+selecteur);
            if(inputRecherche !== null) { inputRecherche.value = ""; }
        }

        maj_selecteur();
    }

    // Libellé associé à une case à cocher
    function libelle_case(check)
    {
        var label = check.parentNode.querySelector('label');
        return (label === null) ? "" : label.textContent;
    }

    // Cases à cocher d'un sélecteur
    function cases_selecteur(selecteur)
    {
        var divRadio = document.getElementById("id_list_check_"+selecteur);
        return (divRadio === null) ? [] : divRadio.querySelectorAll('input[type="checkbox"]');
    }

    // Lit l'état courant de chaque sélecteur
    function etat_selecteur()
    {
        var etats = []

        for(selecteur of list_nom_selecteur)
        {
            var coches = []
            for(check of cases_selecteur(selecteur))
            {
                if(check.checked) { coches.push(libelle_case(check)); }
            }

            var inputRecherche = document.getElementById("id_filtre_"+selecteur);

            etats.push({nom: selecteur,
                        coches: coches,
                        recherche: (inputRecherche === null) ? "" : inputRecherche.value.toUpperCase()})
        }
        return etats
    }

    /* La combinaison passe-t-elle tous les filtres sauf celui d'indice
       ignore ? C'est ce paramètre qui produit l'interdépendance :
         ignore = -1 → tous les sélecteurs s'appliquent
         ignore = i  → le sélecteur i est mis de côté, ce qui donne les
                       valeurs qu'il a encore le droit de proposer        */
    function combinaison_valide(combi, etats, ignore)
    {
        for(var i = 0; i < etats.length; i++)
        {
            if(i === ignore) { continue; }

            // Aucune case cochée => pas de contrainte sur ce sélecteur
            if(etats[i].coches.length === 0) { continue; }

            if(etats[i].coches.indexOf(combi[etats[i].nom]) === -1) { return false; }
        }
        return true
    }

    // Met à jour les valeurs proposées par chaque sélecteur
    function maj_selecteur()
    {
        var etats = etat_selecteur();

        for(var i = 0; i < list_nom_selecteur.length; i++)
        {
            var selecteur = list_nom_selecteur[i];

            // Valeurs encore possibles compte tenu des AUTRES sélecteurs.
            // null = interdépendance indisponible (pas de combinaisons)
            var dispo = null;

            if(list_combinaison.length > 0)
            {
                dispo = new Set();
                for(var k = 0; k < list_combinaison.length; k++)
                {
                    if(combinaison_valide(list_combinaison[k], etats, i))
                    {
                        dispo.add(list_combinaison[k][selecteur]);
                    }
                }
            }

            var visibles = 0;
            var cochees = 0;

            for(check of cases_selecteur(selecteur))
            {
                var txt = libelle_case(check);

                // Une valeur cochée reste visible même si elle n'est plus
                // proposée, sinon il deviendrait impossible de la décocher
                var compatible = (dispo === null) || dispo.has(txt) || check.checked;

                // La recherche ne filtre QUE la liste affichée,
                // elle n'a aucun effet sur le graphique
                var trouve = txt.toUpperCase().indexOf(etats[i].recherche) !== -1;

                var affiche = compatible && trouve;
                check.parentNode.style.display = affiche ? "" : "none";

                if(affiche)
                {
                    visibles++;
                    if(check.checked) { cochees++; }
                }
            }

            // "Tout cocher" reflète l'état des valeurs réellement visibles
            var inputCoche = document.getElementById("id_radio_"+selecteur);
            if(inputCoche !== null)
            {
                inputCoche.checked = (visibles > 0) && (visibles === cochees);
            }
        }
    }

    /* Données envoyées au serveur.
       Rien de coché sur un sélecteur = aucune contrainte : on envoie alors
       toutes ses valeurs, ce qui évite de modifier la route. Quand la route
       saura traiter une liste vide comme "pas de filtre", il suffira de
       supprimer le bloc marqué ci-dessous.                                */
    function contrainte_selecteur()
    {
        var server_data = {};

        for(selecteur of list_nom_selecteur)
        {
            var liste_cases = cases_selecteur(selecteur);

            var coches = [];
            for(check of liste_cases)
            {
                if(check.checked) { coches.push(libelle_case(check)); }
            }

            // --- bloc à supprimer le jour où la route gère la liste vide ---
            if(coches.length === 0)
            {
                for(check of liste_cases) { coches.push(libelle_case(check)); }
            }
            // ---------------------------------------------------------------

            server_data[selecteur] = coches;
        }
        return server_data;
    }

    create_graph_analyse_CE2 = function()
    {
        var server_data = contrainte_selecteur();

        server_data["b_ordonner"] = document.getElementById("id_radio_ordonner_CE").checked

        var div_spinner_upload = document.createElement('div');
        div_spinner_upload.className = "spinner-border";
        document.getElementById("id_CE").appendChild(div_spinner_upload);

        $.ajax({
                type: "POST",
                url: "/create_graph_analyse_CE2",
                data: JSON.stringify(server_data),
                contentType: "application/json",
                dataType: 'json'
                }).done(function(data){
                    var graph = JSON.parse(data["graph"])
                    graph.config={displaylogo: false, responsive: true}
                    Plotly.newPlot("plotly_graph_analyse_CE2", graph, {});
                    document.getElementById("id_CE").removeChild(div_spinner_upload);
                });
    }

    create_graph_analyse_CCC = function()
    {
        var select_designation_article = document.getElementById("id_select_designation_article")

        if(select_designation_article.value!="")
        {
            var server_data = {"designation_article": select_designation_article.value};

            server_data["b_ordonner"] = document.getElementById("id_radio_ordonner_CCC").checked

            var div_spinner_upload = document.createElement('div');
            div_spinner_upload.className = "spinner-border";
            document.getElementById("id_CCC").appendChild(div_spinner_upload);

            $.ajax({
                    type: "POST",
                    url: "/create_graph_analyse_CCC2",
                    data: JSON.stringify(server_data),
                    contentType: "application/json",
                    dataType: 'json'
                    }).done(function(data){
                        var graph = JSON.parse(data["graph"])
                        graph.config={displaylogo: false, responsive: true}
                        Plotly.newPlot("plotly_graph_analyse_CCC", graph, {})
                        document.getElementById('plotly_graph_analyse_CCC').on('plotly_legendclick', function(eventData) {
                            clickedTrace = eventData.fullData[eventData.curveNumber]
                            clickedTraceName = clickedTrace.name
                            if (clickedTrace.visible === 'legendonly') {
                                clickedTrace.visible = true
                            } else if (clickedTrace.visible === true) {
                                clickedTrace.visible = 'legendonly'
                            }
                            const traceVisibility = {};
                            eventData.fullData.forEach(trace => {
                                traceVisibility[trace.name] = trace.visible
                            })

                            const tracesInfo = [];
                            allData = eventData.fullData
                            for (let i = 0; i < allData.length; i++) {
                                const trace = allData[i]
                                const traceInfo = {
                                    name: trace.name,
                                    visible: traceVisibility[trace.name]
                                };
                                tracesInfo.push(traceInfo)
                            }

                            // Déclaration des variables pour conserver l'affichage après le clic
                            var xRange, yRange;

                            // Sauvegarde de l'emplacement d'affichage actuel
                            var layout = eventData.layout;
                            xRange = layout.xaxis.range;
                            yRange = layout.yaxis.range;

                            // Importation dans le layout de l'ancien affichage
                            layout.xaxis.range = xRange;
                            layout.yaxis.range = yRange;

                            $.ajax({
                                url: '/update_graph',
                                method:'POST',
                                contentType:'application/json',
                                data: JSON.stringify({ clickedTraceName: clickedTraceName, traceStatut: tracesInfo, server_data}),
                                success: function(response) {
                                    var newGraph = JSON.parse(response["graph"])
                                    newGraph.layout = layout
                                    newGraph.config={displaylogo: false}
                                    Plotly.react('plotly_graph_analyse_CCC', newGraph, {});
                                },
                                error: function(error) {
                                    console.error("Erreur lors de la mise à jour du graphique :", error);
                                }
                            });
                            return false;
                        })

                        document.getElementById("id_CCC").removeChild(div_spinner_upload);
                    });
        }
        else
        {
            document.getElementById("plotly_graph_analyse_CCC").innerHTML = '';
        }
    }

    /* Recherche dans la liste des valeurs.
       Ne fait que relancer le recalcul : plus aucune manipulation directe
       des labels, qui entrait en conflit avec maj_selecteur(). */
    filtrer = function(evt)
    {
        maj_selecteur();
    }

    /* "Tout cocher" : ne porte que sur les valeurs visibles, donc
       compatibles avec les choix faits sur les autres sélecteurs. */
    coche_decoche = function(evt)
    {
        var selecteur = evt.target.id.replace("id_radio_", "");

        if(list_nom_selecteur.indexOf(selecteur) === -1) { return; }

        for(box of cases_selecteur(selecteur))
        {
            if(box.parentNode.style.display !== "none")
            {
                box.checked = evt.target.checked
            }
        }
        maj_selecteur();
        create_graph_analyse_CE2();
    }
